<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e1e24;
      padding: 2rem;
      border-radius: 12px;
      width: 340px;
      text-align: center;
      border: 1px solid #2d2d35;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }
    h2 {
      margin-top: 0;
      color: #ffffff;
    }
    #userInfo {
      margin: 20px 0;
      line-height: 1.6;
      color: #cccccc;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #ef4444;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #dc2626;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Welcome to Dashboard</h2>
    <p id="userInfo">Loading user profile...</p>
    <button id="logoutBtn">Log Out</button>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
